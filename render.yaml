# Render Blueprint — auto-configures the backend so no manual dashboard setup is needed.
# When this file is present at the repo root, Render infers build/start commands,
# root directory, runtime, and env vars from it. See:
#   https://render.com/docs/blueprint-spec
services:
  - type: web
    name: storyforge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
